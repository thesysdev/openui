name: Update OpenUI starters

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-openui-starters
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.THESYS_PR_CREATOR_APP_ID }}
          private-key: ${{ secrets.THESYS_PR_CREATOR_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Update template OpenUI packages and lockfiles
        run: pnpm templates:update

      - name: Update example OpenUI packages
        run: pnpm examples:update

      - name: Install updated dependencies
        run: pnpm examples:install

      - name: Verify examples
        run: pnpm examples:verify

      - name: Create or update starter pull request
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UPDATE_BRANCH: automation/update-openui-starters
        run: |
          set -euo pipefail

          git config user.name "thesys-pr-creator[bot]"
          git config user.email "thesys-pr-creator[bot]@users.noreply.github.com"
          git switch -C "$UPDATE_BRANCH"
          git add \
            ':(glob)examples/**/package.json' \
            ':(glob)examples/**/pnpm-lock.yaml' \
            ':(glob)examples/**/package-lock.json' \
            ':(glob)templates/**/package.json' \
            ':(glob)templates/**/package-lock.json' \
            ':(glob)templates/**/manifest.json'

          if git diff --cached --quiet; then
            echo "OpenUI templates and examples are already current."
            exit 0
          fi

          remote_sha="$(git ls-remote --heads origin "refs/heads/$UPDATE_BRANCH" | awk '{print $1}')"
          git commit -m "chore: update OpenUI templates and examples"

          if [[ -n "$remote_sha" ]]; then
            git push --force-with-lease="refs/heads/$UPDATE_BRANCH:$remote_sha" origin "HEAD:refs/heads/$UPDATE_BRANCH"
          else
            git push origin "HEAD:refs/heads/$UPDATE_BRANCH"
          fi

          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number')"
          if [[ -n "$existing_pr" ]]; then
            gh pr view "$existing_pr" --repo "$GITHUB_REPOSITORY" --json url --jq .url
            exit 0
          fi

          pr_body="Updates the OpenUI CLI templates, overlays, and examples to the latest published versions of their \`@openuidev/*\` dependencies.

          Template and overlay npm lockfiles were refreshed. Examples were installed from their refreshed lockfiles and all credential-free verification contracts passed before this pull request was created."

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$UPDATE_BRANCH" \
            --title "chore: update OpenUI templates and examples" \
            --body "$pr_body"
