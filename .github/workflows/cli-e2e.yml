name: CLI End to End

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/cli-scaffold-e2e/action.yml"
      - ".github/workflows/cli-e2e.yml"
      - "packages/openui-cli/**"
      - "templates/**"
      - "tsconfig.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/actions/cli-scaffold-e2e/action.yml"
      - ".github/workflows/cli-e2e.yml"
      - "packages/openui-cli/**"
      - "templates/**"
      - "tsconfig.json"

permissions:
  contents: read

jobs:
  package-cli:
    name: Package CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter @openuidev/cli build

      - name: Pack CLI
        working-directory: packages/openui-cli
        run: |
          mkdir -p "${RUNNER_TEMP}/cli-package"
          npm pack --ignore-scripts --pack-destination "${RUNNER_TEMP}/cli-package"

      - uses: actions/upload-artifact@v7
        with:
          name: openui-cli-package
          path: ${{ runner.temp }}/cli-package/*.tgz
          if-no-files-found: error
          retention-days: 1

  cli-e2e:
    name: ${{ matrix.template }} (${{ matrix.package-manager }}@${{ matrix.package-manager-version }}, ${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: package-cli
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        template:
          - openui-cloud
          - openui-self-hosted
        configuration:
          # Keep one npm and pnpm canary for the legacy Node.js line.
          - ubuntu-node20-npm10
          - ubuntu-node20-pnpm9
          # Exercise established and current package-manager majors on Linux.
          - ubuntu-node22-npm10
          - ubuntu-node22-npm11
          - ubuntu-node22-pnpm10
          - ubuntu-node22-pnpm11
          - ubuntu-node24-npm11
          - ubuntu-node24-pnpm10
          - ubuntu-node24-pnpm11
          # Keep the non-Linux jobs focused on the current package-manager majors.
          - macos-node24-npm11
          - macos-node24-pnpm11
          - windows-node24-npm11
          - windows-node24-pnpm11
        include:
          - configuration: ubuntu-node20-npm10
            os: ubuntu-latest
            node-version: 20
            package-manager: npm
            package-manager-version: "10"
          - configuration: ubuntu-node20-pnpm9
            os: ubuntu-latest
            node-version: 20
            package-manager: pnpm
            package-manager-version: "9"
          - configuration: ubuntu-node22-npm10
            os: ubuntu-latest
            node-version: 22
            package-manager: npm
            package-manager-version: "10"
          - configuration: ubuntu-node22-npm11
            os: ubuntu-latest
            node-version: 22
            package-manager: npm
            package-manager-version: "11"
          - configuration: ubuntu-node22-pnpm10
            os: ubuntu-latest
            node-version: 22
            package-manager: pnpm
            package-manager-version: "10"
          - configuration: ubuntu-node22-pnpm11
            os: ubuntu-latest
            node-version: 22
            package-manager: pnpm
            package-manager-version: "11"
          - configuration: ubuntu-node24-npm11
            os: ubuntu-latest
            node-version: 24
            package-manager: npm
            package-manager-version: "11"
          - configuration: ubuntu-node24-pnpm10
            os: ubuntu-latest
            node-version: 24
            package-manager: pnpm
            package-manager-version: "10"
          - configuration: ubuntu-node24-pnpm11
            os: ubuntu-latest
            node-version: 24
            package-manager: pnpm
            package-manager-version: "11"
          - configuration: macos-node24-npm11
            os: macos-latest
            node-version: 24
            package-manager: npm
            package-manager-version: "11"
          - configuration: macos-node24-pnpm11
            os: macos-latest
            node-version: 24
            package-manager: pnpm
            package-manager-version: "11"
          - configuration: windows-node24-npm11
            os: windows-latest
            node-version: 24
            package-manager: npm
            package-manager-version: "11"
          - configuration: windows-node24-pnpm11
            os: windows-latest
            node-version: 24
            package-manager: pnpm
            package-manager-version: "11"

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/cli-scaffold-e2e
        with:
          template: ${{ matrix.template }}
          backend-framework: default
          node-version: ${{ matrix.node-version }}
          package-manager: ${{ matrix.package-manager }}
          package-manager-version: ${{ matrix.package-manager-version }}

  # The default overlay is covered above across operating systems and package
  # manager majors; overlays only change dependencies and app code, so one
  # current Linux configuration per package manager is enough.
  cli-e2e-overlays:
    name: ${{ matrix.template }} + ${{ matrix.overlay }} (${{ matrix.package-manager }}@11, ubuntu, Node 24)
    needs: package-cli
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - openui-cloud
          - openui-self-hosted
        overlay:
          - langgraph
          - vercel-ai-sdk
          - vercel-eve
        package-manager:
          - npm
          - pnpm

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/cli-scaffold-e2e
        with:
          template: ${{ matrix.template }}
          backend-framework: ${{ matrix.overlay }}
          node-version: 24
          package-manager: ${{ matrix.package-manager }}
          package-manager-version: "11"
