name: Docs bandwidth budget

# openui.com is billed by bytes served. This builds the docs, opens key pages in
# a browser and fails if a page got heavier than its budget or keeps
# downloading while it sits open. Budgets: .github/scripts/docs-bandwidth/budgets.json

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/**"
      - ".github/scripts/docs-bandwidth/**"
      - ".github/workflows/docs-bandwidth.yml"

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v2
        with:
          version: 9.0.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Install Playwright
        working-directory: .github/scripts/docs-bandwidth
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chrome

      - name: Check bandwidth budget
        run: |
          (cd docs && pnpm start --port 3000 > /tmp/docs.log 2>&1 &)
          npx --yes wait-on@8.0.3 -t 120000 http://localhost:3000
          BASE_URL=http://localhost:3000 node .github/scripts/docs-bandwidth/check.mjs
