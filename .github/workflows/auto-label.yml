name: Auto label

on:
  issues:
    types: [opened, edited, reopened]
  # pull_request_target so PRs from forks can be labeled too. Safe because the
  # job only checks out the default branch and never runs code from the PR.
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  # Manual run: labels every open issue and PR.
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: auto-label-${{ github.event.issue.number || github.event.pull_request.number || 'backfill' }}

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/auto-label.cjs');
            await run({ github, context, core });
