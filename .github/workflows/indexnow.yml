name: IndexNow

# After each production deploy, tells IndexNow search engines (Bing, Yandex, ...) to recrawl the
# docs and blog pages the deployed commit added, changed or removed. The key is the INDEXNOW_KEY
# secret; the docs site serves it at /<key>.txt from the INDEXNOW_KEY env var on Vercel.
on:
  deployment_status:

permissions: {}

jobs:
  submit:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HOST: www.openui.com
      KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 2

      - name: Submit changed pages
        run: |
          # docs/content/docs/a/index.mdx -> /docs/a. Cookbooks and demos are served at the top level
          # (TOP_LEVEL_SECTIONS in docs/lib/source.ts).
          urls=$(git diff --name-only --no-renames HEAD~1 HEAD -- 'docs/content/*.mdx' \
            | sed -E 's#^docs/content/##; s#\.mdx$##; s#/index$##; s#^docs/(cookbooks|demos)(/|$)#\1\2#' \
            | sed "s#^#https://$HOST/#")
          if [ -z "$urls" ]; then
            echo "No docs or blog pages changed"
            exit 0
          fi
          echo "Submitting $(echo "$urls" | wc -l) URLs:"
          echo "$urls"
          jq -n --arg host "$HOST" --arg key "$KEY" --arg urls "$urls" \
            '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: ($urls | split("\n"))}' \
            | curl -fsS -o /dev/null -w 'IndexNow responded %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
                -H 'Content-Type: application/json; charset=utf-8' --data-binary @-
