name: IndexNow

# After each production deploy, tells IndexNow search engines (Bing, Yandex, ...) which sitemap URLs
# were added, changed or removed since the last run. Each run keeps its page hashes as an artifact
# for the next run to compare against. The key is the INDEXNOW_KEY secret; the docs site serves it
# at /<key>.txt from the INDEXNOW_KEY env var on Vercel.
on:
  deployment_status:

permissions: {}

jobs:
  submit:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    # One submission at a time, so each compares against the hashes the previous one saved. Set on
    # the job, not the workflow, so skipped preview-deploy runs never cancel a queued production run.
    concurrency:
      group: indexnow
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: docs/scripts

      - name: Download the previous run's page hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=indexnow-page-hashes&per_page=1" \
            --jq '.artifacts[] | select(.expired | not) | .workflow_run.id')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n indexnow-page-hashes -D previous
          else
            echo "No previous page hashes; submitting every URL"
          fi

      - name: Submit changed URLs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node docs/scripts/submit-indexnow.mjs previous/page-hashes.json page-hashes.json

      - uses: actions/upload-artifact@v7
        with:
          name: indexnow-page-hashes
          path: page-hashes.json
          retention-days: 90
