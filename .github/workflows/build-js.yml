name: Build JS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: v24.21.0
          cache: pnpm
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Run Packages CI
        run: pnpm --filter "./packages/**" --workspace-concurrency=1 run ci

  build-examples:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect example changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            examples:
              - 'examples/**'
              - 'scripts/manage-starters.mjs'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.github/workflows/build-js.yml'

      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.examples == 'true'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.examples == 'true'
        with:
          node-version: v24.21.0
          cache: pnpm
          cache-dependency-path: "examples/**/pnpm-lock.yaml"

      - name: Install dependencies
        if: steps.changes.outputs.examples == 'true'
        run: pnpm examples:install

      - name: Verify examples
        if: steps.changes.outputs.examples == 'true'
        run: pnpm examples:verify
