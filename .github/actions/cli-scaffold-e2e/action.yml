name: CLI scaffold end to end
description: Scaffold a template with the packed CLI, then install and build the generated app.

inputs:
  template:
    description: Template to scaffold from the checkout.
    required: false
    default: openui-cloud
  backend-framework:
    description: Overlay key passed to `openui create --backend-framework`.
    required: false
    default: langgraph
  node-version:
    description: Node.js major version used to run the CLI and the generated app.
    required: true
  package-manager:
    description: Package manager the CLI should select (npm or pnpm).
    required: true
  package-manager-version:
    description: Expected package manager major version.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Set up npm ${{ inputs.package-manager-version }}
      if: inputs.package-manager == 'npm'
      shell: bash
      run: npm install --global npm@${{ inputs.package-manager-version }}

    - uses: pnpm/action-setup@v6
      if: inputs.package-manager == 'pnpm'
      with:
        version: ${{ inputs.package-manager-version }}
        # The matrix version must win here; reading the repo root's
        # packageManager field (pnpm@10.33.0) alongside an explicit version
        # is a hard error in action-setup v6, so point it at a manifest
        # without that field.
        package_json_file: packages/openui-cli/package.json

    - name: Verify package manager version
      shell: bash
      # Outside the repo checkout: inside it, pnpm >=10 self-switches to the
      # root packageManager version (pnpm@10.33.0) and would report that
      # instead of the matrix-installed version. The e2e steps below all run
      # under runner.temp too, so this verifies what they will actually use.
      working-directory: ${{ runner.temp }}
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        EXPECTED_MAJOR: ${{ inputs.package-manager-version }}
      run: |
        actual_version="$("${PACKAGE_MANAGER}" --version)"
        if [[ "${actual_version}" != "${EXPECTED_MAJOR}".* ]]; then
          echo "Expected ${PACKAGE_MANAGER} ${EXPECTED_MAJOR}.x, got ${actual_version}" >&2
          exit 1
        fi

    - uses: actions/download-artifact@v8
      with:
        name: openui-cli-package
        path: ${{ runner.temp }}/cli-package

    - name: Locate CLI package and prepare workspace
      id: cli-package
      shell: bash
      env:
        CLI_PACKAGE_DIR: ${{ runner.temp }}/cli-package
        CLI_E2E_DIR: ${{ runner.temp }}/cli-e2e
      run: |
        node --input-type=module -e "
          import fs from 'node:fs';
          import path from 'node:path';
          const tarballs = fs.readdirSync(process.env.CLI_PACKAGE_DIR).filter((file) => file.endsWith('.tgz'));
          if (tarballs.length !== 1) throw new Error('Expected exactly one CLI tarball');
          const tarball = path.join(process.env.CLI_PACKAGE_DIR, tarballs[0]);
          fs.mkdirSync(process.env.CLI_E2E_DIR, { recursive: true });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'path=' + tarball + '\n');
        "

    # OPENUI_DEBUG + OPENUI_SOURCE_DIR makes the CLI scaffold the checkout's
    # templates instead of fetching them from `main`, so template changes are
    # tested here.
    - name: Run CLI with npm
      if: inputs.package-manager == 'npm' && inputs.template == 'openui-cloud'
      shell: bash
      working-directory: ${{ runner.temp }}/cli-e2e
      env:
        OPENUI_DEBUG: "1"
        OPENUI_SOURCE_DIR: ${{ github.workspace }}
      run: >-
        npm exec --yes --package="${{ steps.cli-package.outputs.path }}" --
        openui --no-telemetry create
        --name generated-app
        --backend-framework ${{ inputs.backend-framework }}
        --no-interactive
        --no-skill

    - name: Run CLI with pnpm
      if: inputs.package-manager == 'pnpm' && inputs.template == 'openui-cloud'
      shell: bash
      working-directory: ${{ runner.temp }}/cli-e2e
      env:
        OPENUI_DEBUG: "1"
        OPENUI_SOURCE_DIR: ${{ github.workspace }}
        THESYS_API_KEY: "sk-test"
      run: >-
        pnpm dlx "${{ steps.cli-package.outputs.path }}"
        --no-telemetry create
        --name generated-app
        --backend-framework ${{ inputs.backend-framework }}
        --no-interactive
        --no-skill

    # `openui create` currently selects Cloud unconditionally. Exercise the
    # packed CLI's scaffold function for the self-hosted template as well.
    - name: Scaffold self-hosted template
      if: inputs.template == 'openui-self-hosted'
      shell: bash
      working-directory: ${{ runner.temp }}/cli-e2e
      env:
        CLI_PACKAGE: ${{ steps.cli-package.outputs.path }}
        SOURCE_DIR: ${{ github.workspace }}
        BACKEND_FRAMEWORK: ${{ inputs.backend-framework }}
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      run: |
        npm install --prefix cli-runner --ignore-scripts --no-audit --no-fund "${CLI_PACKAGE}"
        node --input-type=module <<'NODE'
        import path from 'node:path';
        import { createRequire } from 'node:module';
        const require = createRequire(import.meta.url);
        const { applyScaffoldFiles } = require('./cli-runner/node_modules/@openuidev/cli/dist/lib/scaffold/index.js');
        applyScaffoldFiles({
          templateDir: path.join(process.env.SOURCE_DIR, 'templates', 'openui-self-hosted'),
          targetDir: path.resolve('generated-app'),
          name: 'generated-app',
          packageManager: process.env.PACKAGE_MANAGER,
          backendFramework: process.env.BACKEND_FRAMEWORK,
        });
        NODE
        cd generated-app
        if [[ "${PACKAGE_MANAGER}" == "npm" ]]; then
          npm ci --prefer-offline --no-audit --no-fund --progress=false
        else
          pnpm install
        fi

    # npm- and pnpm-installed node_modules can both satisfy either run command.
    # Check manager metadata and lockfile retention to verify CLI selection.
    - name: Verify selected package manager
      shell: bash
      working-directory: ${{ runner.temp }}/cli-e2e/generated-app
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      run: |
        node --input-type=module -e "
          import fs from 'node:fs';
          import path from 'node:path';
          const marker = process.env.PACKAGE_MANAGER === 'pnpm'
            ? path.join('node_modules', '.modules.yaml')
            : path.join('node_modules', '.package-lock.json');
          if (!fs.existsSync(marker)) throw new Error('Missing ' + process.env.PACKAGE_MANAGER + ' install marker: ' + marker);
          const hasNpmLockfile = fs.existsSync('package-lock.json');
          if (process.env.PACKAGE_MANAGER === 'npm' && !hasNpmLockfile) {
            throw new Error('npm-generated project is missing package-lock.json');
          }
          if (process.env.PACKAGE_MANAGER !== 'npm' && hasNpmLockfile) {
            throw new Error(process.env.PACKAGE_MANAGER + '-generated project retained package-lock.json');
          }
        "

    - name: Verify generated component spec
      shell: bash
      working-directory: ${{ runner.temp }}/cli-e2e/generated-app
      run: |
        ${{ inputs.package-manager }} run generate
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';
        import fs from 'node:fs';
        const spec = JSON.parse(fs.readFileSync('src/generated/spec.json', 'utf8'));
        assert.equal(spec.root, 'Col');
        for (const name of ['Col', 'Row', 'Title', 'Text', 'Table', 'Chart', 'Form', 'HtmlView']) {
          assert.ok(spec.components[name], `Missing component: ${name}`);
        }
        for (const name of ['Stack', 'TextContent', 'CardHeader', 'Callout', 'Buttons', 'FollowUpBlock', 'Tabs', 'Accordion', 'BarChart']) {
          assert.ok(!spec.components[name], `Legacy component: ${name}`);
        }
        NODE

    - name: Build generated app
      shell: bash
      working-directory: ${{ runner.temp }}/cli-e2e/generated-app
      run: ${{ inputs.package-manager }} run build
      env:
        THESYS_API_KEY: sk-test
        OPENAI_API_KEY: sk-test
        DEMO_USER_ID: test-user
