# Allow native build scripts so `pnpm install` never stops at (or nags about)
# approve-builds. pnpm reads this from a different place per major version, so
# the same list appears three times: package.json "pnpm" field (<=10.13),
# onlyBuiltDependencies here (10.14-10.x), allowBuilds here (>=11).
onlyBuiltDependencies:
  - "@openuidev/lang-core"
  - esbuild
  - sharp
  - unrs-resolver
allowBuilds:
  '@google/genai': set this to true or false
  "@openuidev/lang-core": true
  esbuild: true
  protobufjs: set this to true or false
  sharp: true
  sqlite3: set this to true or false
  unrs-resolver: true
packages: [ "." ]
minimumReleaseAgeExclude:
  - "@openuidev/*"
# Same overrides as the package.json "pnpm" field, which pnpm 10.14+ no longer reads.
overrides:
  "postcss@<8.5.10": ">=8.5.10"
  "uuid@<11.1.1": "^11.1.1"
  "proxy-addr@<2.0.8": "^2.0.8"
  "mariadb@<3.5.4": "^3.5.4"
  "mysql2@<3.23.1": "^3.23.1"
  "fast-uri@<3.1.8": "^3.1.8"
  "brace-expansion@<1.1.21": "^1.1.21"
  "brace-expansion@>=5 <5.0.12": "^5.0.12"
  "@grpc/grpc-js@<1.14.5": "^1.14.5"
  "source-map-js@<1.2.2": "^1.2.2"
  "@modelcontextprotocol/sdk@<1.32.0": "^1.32.0"
  "@opentelemetry/core@<2.8.0": "^2.8.0"
  "qs@<6.16.0": "^6.16.0"
  "ip-address@<10.7.4": "^10.7.4"
  "hono@<4.13.11": "^4.13.11"
  "node-gyp@<11": "^11.5.0"
  "adm-zip@<0.6.1": "^0.6.1"
  "tar@<7.5.21": "^7.5.21"
