<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fcfcfa"/><stop offset="1" stop-color="#edf5f0"/></linearGradient><linearGradient id="client" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5f5ed"/><stop offset="1" stop-color="#ccebdd"/></linearGradient><linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#172c24"/><stop offset="1" stop-color="#087e68"/></linearGradient><filter id="lift" x="-15%" y="-15%" width="130%" height="145%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#163e2c" flood-opacity="0.09"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1 L8 5 L2 9" fill="none" stroke="#48564f" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1 L8 5 L2 9" fill="none" stroke="#087e68" stroke-width="1.6" stroke-linejoin="round"/></marker></defs><rect width="1600" height="850" fill="url(#bg)"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="78" font-size="49" fill="url(#ink)" font-weight="700" text-anchor="start">What happens when you move the slider?</text><text x="50" y="121" font-size="27" fill="#4a6659" font-weight="400" text-anchor="start">ChatGPT Intelligent UI · A local interaction, step by step</text><rect x="40" y="161" width="1520" height="639" rx="18" fill="url(#client)" stroke="#bcdcca" stroke-width="2"/><text x="68" y="210" font-size="25" fill="#087e68" font-weight="600" text-anchor="start">USER CLIENT</text><text x="1530" y="210" font-size="22" fill="#52665b" font-weight="400" text-anchor="end">ChatGPT web</text><rect x="80" y="248" width="40" height="40" rx="20" fill="#143d30" stroke="#143d30" stroke-width="2"/><text x="100" y="277" font-size="23" fill="#fff" font-weight="600" text-anchor="middle">1</t