ht="312" rx="14" fill="#fff" stroke="#d8dfda" stroke-width="2" filter="url(#lift)"/><text x="646" y="362" font-size="26" fill="#182b24" font-weight="600" text-anchor="start">Sandboxed worker</text><rect x="645" y="388" width="310" height="161" rx="10" fill="#143d30" stroke="#143d30" stroke-width="2"/><text x="667" y="429" font-size="26" fill="#b0f1cd" font-weight="400" text-anchor="start" font-family="Menlo, monospace">setSeats(9)</text><text x="667" y="474" font-size="25" fill="#fff" font-weight="400" text-anchor="start" font-family="Menlo, monospace">seats: 8 → 9</text><text x="667" y="520" font-size="25" fill="#b0f1cd" font-weight="400" text-anchor="start" font-family="Menlo, monospace">9 × $29 = $261</text><text x="646" y="592" font-size="22" fill="#536159" font-weight="400" text-anchor="start">Re-render and compare trees.</text><rect x="1160" y="317" width="360" height="312" rx="14" fill="#fff" stroke="#d8dfda" stroke-width="2" filter="url(#lift)"/><text x="1186" y="362" font-size="25" fill="#182b24" font-weight="600" text-anchor="start">Team plan estimate</text><text x="1186" y="426" font-size="50" fill="#087e68" font-weight="600" text-anchor="start">$261</text><text x="1315" y="426" font-size="25" fill="#536159" font-weight="400" text-anchor="start">/ mo</text><text x="1186" y="476" font-size="27" fill="#182b24" font-weight="600" text-anchor="start">9 seats</text><path d="M1189 523 H1490" fill="none" stroke="#d7e3dc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1189 523 H1261" fill="none" stroke="#087e68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1261" cy="523" r="11" fill="#fff" stroke="#087e68" stroke-width="3"/><text x="1186" y="604" font-size="20" fill="#536159" font-weight="400" text-anchor="start">The native renderer applies updates.</text><path d="M440 461 H620" fill="none" stroke="#087e68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/><rect x="452" y="431" width="155" height="61" rx="6" fill="#dcf0e5" stroke="#dcf0e5" stroke-width="2"/><text x="530" y="454" font-size="23" fill="#087e68" font-weight="600" text-anchor="middle">Callback +</text><text x="530" y="482" font-size="23" fill="#087e68" font-weight="400" text-anchor="middle">value 9</text><path d="M980 461 H1160" fill="none" stroke="#087e68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/><rect x="992" y="431" width="155" height="61" rx="6" fill="#d4edde" stroke="#d4edde" stroke-width="2"/><text x="1070" y="454" font-size="23" fill="#087e68" font-weight="600" text-anchor="middle">UI update</text><text x="1070" y="482" font-size="23" fill="#087e68" font-weight="400" text-anchor="middle">operations</text><rect x="400" y="698" width="800" height="65" rx="12" fill="#143d30" stroke="#143d30" stroke-width="2"/><text x="800" y="740" font-size="28" fill="#fff" font-weight="600" text-anchor="middle">State and UI change. No additional model call.</text></g></svg>