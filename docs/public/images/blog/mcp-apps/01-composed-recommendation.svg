<text x="80" y="356" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="650">Maps</text>
<text x="80" y="383" text-anchor="start" fill="#647087" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500">Travel time</text>
<rect x="60" y="415" width="300" height="72" rx="14" fill="#FAFBFE" stroke="#DDE3EE" stroke-width="2"/>
<text x="80" y="445" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="650">Concur</text>
<text x="80" y="472" text-anchor="start" fill="#647087" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500">Company policy</text>
<path d="M363 184 L470 315" fill="none" stroke="#BEC8DC" stroke-width="2" stroke-linecap="round"/>
<path d="M363 273 L470 315" fill="none" stroke="#BEC8DC" stroke-width="2" stroke-linecap="round"/>
<path d="M363 362 L470 315" fill="none" stroke="#BEC8DC" stroke-width="2" stroke-linecap="round"/>
