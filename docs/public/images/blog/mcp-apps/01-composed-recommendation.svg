<rect x="472" y="224" width="245" height="180" rx="22" fill="#EEF1FF" stroke="#BEC7FF" stroke-width="2"/>
<text x="594" y="279" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Agent</text>
<text x="594" y="316" text-anchor="middle" fill="#647087" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="450">combines the</text>
<text x="594" y="345" text-anchor="middle" fill="#647087" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="450">task context</text>
