<rect x="79" y="232" width="44" height="44" rx="22" fill="#EEF1FF" stroke="none" stroke-width="0"/>
<text x="101" y="261" text-anchor="middle" fill="#465DFF" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">1</text>
<text x="79" y="323" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="650">Host agent</text>
<text x="79" y="359" text-anchor="start" fill="#647087" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500">Gathers tool results</text>
<rect x="343" y="214" width="231" height="185" rx="18" fill="#FFFFFF" stroke="#BFC8E2" stroke-width="2"/>
<rect x="361" y="232" width="44" height="44" rx="22" fill="#EEF1FF" stroke="none" stroke-width="0"/>
<text x="383" y="261" text-anchor="middle" fill="#465DFF" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">2</text>
<text x="361" y="323" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="650">visualize(data)</text>
<text x="361" y="359" text-anchor="start" fill="#647087" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500">Passes selected context</text>
<rect x="625" y="214" width="231" height="185" rx="18" fill="#FFFFFF" stroke="#BFC8E2" stroke-width="2"/>
<rect x="643" y="232" width="44" height="44" rx="22" fill="#EEF1FF" stroke="none" stroke-width="0"/>
<text x="665" y="261" text-anchor="middle" fill="#465DFF" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">3</text>
<text x="643" y="323" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="650">OpenUI model</text>
<text x="643" y="359" text-anchor="start" fill="#647087" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500">Generates an interface</text>
<rect x="907" y="214" width="231" height="185" rx="18" fill="#FFFFFF" stroke="#BFC8E2" stroke-width="2"/>
<rect x="925" y="232" width="44" height="44" rx="22" fill="#EEF1FF" stroke="none" stroke-width="0"/>
<text x="947" y="261" text-anchor="middle" fill="#465DFF" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">4</text>
<text x="925" y="323" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="650">MCP App</text>
<text x="925" y="359" text-anchor="start" fill="#647087" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500">Renders in an iframe</text>
