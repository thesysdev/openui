<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title>What the harness changed. Dashboard quality with Claude Haiku 5.5, scored blind: 94 out of 120 as a single call, 110 with the harness. Clean dashboards out of 27 requests: 22 to 24 as a single call, 27 with the harness. Time to add filters and previous periods to a dashboard: 301 seconds on Sonnet 5.5 at default effort, 90 seconds on Gemini 4 Neon at low effort.</title>
  <rect width="960" height="420" rx="16" fill="#ffffff"/>
  <g font-size="13" fill="#52525b">
    <rect x="40" y="30" width="14" height="14" rx="3" fill="#d4d4d8"/>
    <text x="62" y="42">Before</text>
    <rect x="130" y="30" width="14" height="14" rx="3" fill="#6d5dfc"/>
    <text x="152" y="42">After</text>
  </g>

  <!-- Row 1: quality, scale 0..120 over 560px starting x=320 -->
  <text x="40" y="96" font-size="16" font-weight="600" fill="#18181b">Dashboard quality</text>
  <text x="40" y="118" font-size="13" fill="#71717a">Claude Haiku 5.5, scored blind, out of 120</text>
  <rect x="320" y="80" width="439" height="20" rx="4" fill="#d4d4d8"/>
  <text x="767" y="95" font-size="14" fill="#3f3f46">94 · single call</text>
  <rect x="320" y="106" width="513" height="20" rx="4" fill="#6d5dfc"/>
  <text x="841" y="121" font-size="14" font-weight="600" fill="#18181b">110 · harness</text>

  <!-- Row 2: clean dashboards, scale 0..27 over 560px -->
  <text x="40" y="206" font-size="16" font-weight="600" fill="#18181b">Clean dashboards</text>
  <text x="40" y="228" font-size="13" fill="#71717a">out of 27 requests</text>
  <rect x="320" y="190" width="456" height="20" rx="4" fill="#d4d4d8"/>
  <rect x="776" y="190" width="41" height="20" rx="0" fill="#d4d4d8" opacity="0.5"/>
  <text x="825" y="205" font-size="14" fill="#3f3f46">22–24 · single call</text>
  <rect x="320" y="216" width="560" height="20" rx="4" fill="#6d5dfc"/>
  <text x="888" y="231" font-size="14" font-weight="600" fill="#18181b">27</text>

  <!-- Row 3: edit time, scale 0..301 over 560px (shorter is better) -->
  <text x="40" y="316" font-size="16" font-weight="600" fill="#18181b">Time to add filters</text>
  <text x="40" y="338" font-size="13" fill="#71717a">and previous periods, shorter is better</text>
  <rect x="320" y="300" width="560" height="20" rx="4" fill="#d4d4d8"/>
  <text x="320" y="292" font-size="12" fill="#71717a">Sonnet 5.5, default effort</text>
  <text x="888" y="315" font-size="14" fill="#3f3f46">301 s</text>
  <rect x="320" y="326" width="167" height="20" rx="4" fill="#6d5dfc"/>
  <text x="495" y="341" font-size="14" font-weight="600" fill="#18181b">90 s · Gemini 4 Neon, low effort</text>
  <text x="40" y="392" font-size="12" fill="#a1a1aa">Quality: 6 dashboards, judged blind. Clean dashboards: a benchmark over public data APIs. Edit time: median of 5.</text>
</svg>
