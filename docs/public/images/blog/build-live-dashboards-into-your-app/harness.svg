<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title>The build harness: a request becomes a prompt from your component library, the model explores your data tools and writes the dashboard, which is checked against your library and rendered against real data, repaired if needed, then saved.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#71717a"/>
    </marker>
  </defs>
  <rect width="960" height="380" rx="16" fill="#ffffff"/>

  <text x="40" y="44" font-size="13" font-weight="600" fill="#71717a" letter-spacing="0.08em">BUILD</text>
  <g font-size="15" fill="#18181b">
    <rect x="40" y="62" width="190" height="78" rx="12" fill="#f4f4f5" stroke="#d4d4d8"/>
    <text x="135" y="96" text-anchor="middle" font-weight="600">Your request</text>
    <text x="135" y="118" text-anchor="middle" font-size="13" fill="#52525b">"orders by day, by status"</text>

    <rect x="270" y="62" width="190" height="78" rx="12" fill="#f4f4f5" stroke="#d4d4d8"/>
    <text x="365" y="96" text-anchor="middle" font-weight="600">Prompt from</text>
    <text x="365" y="118" text-anchor="middle" font-weight="600">your library</text>

    <rect x="500" y="62" width="190" height="78" rx="12" fill="#f4f4f5" stroke="#d4d4d8"/>
    <text x="595" y="96" text-anchor="middle" font-weight="600">Explore your data</text>
    <text x="595" y="118" text-anchor="middle" font-size="13" fill="#52525b">your tools, in rounds</text>

    <rect x="730" y="62" width="190" height="78" rx="12" fill="#f4f4f5" stroke="#d4d4d8"/>
    <text x="825" y="96" text-anchor="middle" font-weight="600">Write the</text>
    <text x="825" y="118" text-anchor="middle" font-weight="600">dashboard</text>
  </g>
  <g stroke="#71717a" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="232" y1="101" x2="266" y2="101"/>
    <line x1="462" y1="101" x2="496" y2="101"/>
    <line x1="692" y1="101" x2="726" y2="101"/>
    <path d="M825 142 L825 172 L135 172 L135 202"/>
  </g>
  <path d="M560 62 C 560 36, 630 36, 630 62" stroke="#a1a1aa" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <text x="40" y="196" font-size="13" font-weight="600" fill="#6d5dfc" letter-spacing="0.08em">CHECK</text>
  <g font-size="15" fill="#18181b">
    <rect x="40" y="208" width="190" height="78" rx="12" fill="#f1efff" stroke="#c4bcfd"/>
    <text x="135" y="242" text-anchor="middle" font-weight="600">Check against</text>
    <text x="135" y="264" text-anchor="middle" font-weight="600">your library</text>

    <rect x="270" y="208" width="190" height="78" rx="12" fill="#f1efff" stroke="#c4bcfd"/>
    <text x="365" y="242" text-anchor="middle" font-weight="600">Render with your</text>
    <text x="365" y="264" text-anchor="middle" font-weight="600">real data</text>

    <rect x="500" y="208" width="190" height="78" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <text x="595" y="242" text-anchor="middle" font-weight="600">Repair what's wrong</text>
    <text x="595" y="264" text-anchor="middle" font-size="13" fill="#52525b">up to 3 tries</text>

    <rect x="730" y="208" width="190" height="78" rx="12" fill="#ecfdf5" stroke="#86efac"/>
    <text x="825" y="242" text-anchor="middle" font-weight="600">Save, and stream</text>
    <text x="825" y="264" text-anchor="middle" font-weight="600">to every viewer</text>
  </g>
  <g stroke="#71717a" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="232" y1="247" x2="266" y2="247"/>
    <line x1="462" y1="247" x2="496" y2="247"/>
    <line x1="692" y1="247" x2="726" y2="247"/>
  </g>
  <path d="M595 288 L595 318 L135 318 L135 290" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
  <text x="365" y="340" text-anchor="middle" font-size="13" fill="#9a3412">checked again after every repair</text>
  <text x="595" y="166" text-anchor="middle" font-size="12" fill="#a1a1aa"> </text>
</svg>
