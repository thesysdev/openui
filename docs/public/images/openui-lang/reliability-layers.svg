<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1120"
  height="390"
  viewBox="0 0 1120 390"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Generative UI reliability pipeline</title>
  <desc id="description">
    A component schema and system prompt guide the selected model. The model produces generated UI,
    which is validated and corrected before reaching users. Reliability Monitoring measures the result and
    provides feedback for improvements across the pipeline.
  </desc>

  <style>
    .surface { fill: #ffffff; }
    .frame { fill: none; stroke: #e9e8ed; }
    .card { fill: #f7f6f9; stroke: #e5e3e9; }
    .card-accent { fill: #f3efff; stroke: #c4b5fd; }
    .observe { fill: #faf9fb; stroke: #dedce3; }
    .ink { fill: #17151d; }
    .muted { fill: #716e7b; }
    .faint { fill: #9895a1; }
    .accent-fill { fill: #7c3aed; }
    .accent-stroke { stroke: #7c3aed; }
    .arrow-neutral { fill: #b6b2be; }
    .arrow-accent { fill: #7c3aed; }
    .connector { fill: none; stroke: #b6b2be; stroke-width: 2; }
    .feedback { fill: none; stroke: #7c3aed; stroke-width: 2; }
    text {
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .node-title { font-size: 16px; font-weight: 600; }
    .node-copy { font-size: 13px; font-weight: 400; }
    .observe-title { font-size: 16px; font-weight: 600; }
    .observe-copy { font-size: 14px; font-weight: 400; }
    .feedback-label { font-size: 12px; font-weight: 600; }

    @media (prefers-color-scheme: dark) {
      .surface { fill: #17161a; }
      .frame { stroke: #323036; }
      .card { fill: #242228; stroke: #39363e; }
      .card-accent { fill: #292239; stroke: #7256b5; }
      .observe { fill: #201e23; stroke: #39363e; }
      .ink { fill: #f4f2f7; }
      .muted { fill: #b4b0bc; }
      .faint { fill: #8e8996; }
      .accent-fill { fill: #a78bfa; }
      .accent-stroke { stroke: #a78bfa; }
      .arrow-neutral { fill: #b4b0bc; }
      .arrow-accent { fill: #a78bfa; }
      .connector { stroke: #5c5863; }
      .feedback { stroke: #a78bfa; }
    }
  </style>

  <defs>
    <marker
      id="arrow-neutral"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path class="arrow-neutral" d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
    <marker
      id="arrow-accent"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path class="arrow-accent" d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
  </defs>

  <rect class="surface" x="0.5" y="0.5" width="1119" height="389" rx="20" />
  <rect class="frame" x="0.5" y="0.5" width="1119" height="389" rx="20" />

  <rect class="card" x="48" y="51" width="224" height="72" rx="10" />
  <circle class="accent-fill" cx="68" cy="73" r="5" />
  <text class="node-title ink" x="82" y="79">Component schema</text>
  <text class="node-copy muted" x="60" y="105">Clear names and focused props</text>

  <rect class="card" x="48" y="151" width="224" height="72" rx="10" />
  <circle class="accent-fill" cx="68" cy="173" r="5" />
  <text class="node-title ink" x="82" y="179">System prompt</text>
  <text class="node-copy muted" x="60" y="205">Targeted rules and valid examples</text>

  <path
    class="connector"
    d="M272 87 H300 V151 H326"
    marker-end="url(#arrow-neutral)"
  />
  <path class="connector" d="M272 187 H300 V151" />

  <rect class="card" x="330" y="101" width="188" height="100" rx="10" />
  <circle class="accent-fill" cx="352" cy="125" r="5" />
  <text class="node-title ink" x="366" y="131">Model selection</text>
  <text class="node-copy muted" x="352" y="159">Evaluate reliability,</text>
  <text class="node-copy muted" x="352" y="179">latency, and cost</text>

  <path
    class="connector"
    d="M518 151 H557"
    marker-end="url(#arrow-neutral)"
  />

  <rect class="card" x="575" y="101" width="170" height="100" rx="10" />
  <text class="node-title ink" x="597" y="135">Generated UI</text>
  <text class="node-copy muted" x="597" y="163">Probabilistic</text>
  <text class="node-copy muted" x="597" y="183">model output</text>

  <path
    class="connector"
    d="M745 151 H774"
    marker-end="url(#arrow-neutral)"
  />

  <rect class="card-accent" x="792" y="101" width="208" height="100" rx="10" />
  <circle class="accent-fill" cx="814" cy="125" r="5" />
  <text class="node-title ink" x="828" y="131">Validate and correct</text>
  <text class="node-copy muted" x="814" y="159">Detect invalid output</text>
  <text class="node-copy muted" x="814" y="179">and repair errors</text>

  <path
    class="connector"
    d="M1000 151 H1031"
    marker-end="url(#arrow-neutral)"
  />
  <circle class="accent-fill" cx="1064" cy="151" r="26" />
  <path
    d="M1053 151 L1061 159 L1076 142"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <text class="node-copy muted" x="1064" y="192" text-anchor="middle">Users</text>

  <path class="connector" d="M896 201 V281" marker-end="url(#arrow-neutral)" />

  <rect class="observe" x="48" y="285" width="1024" height="78" rx="10" />
  <rect class="accent-fill" x="48" y="285" width="6" height="78" rx="3" />
  <text class="observe-title ink" x="76" y="317">Reliability Monitoring</text>
  <text class="observe-copy muted" x="270" y="317">
    Measure errors, identify recurring failures, and verify improvements
  </text>
  <text class="observe-copy muted" x="76" y="344">
    Production generations provide feedback for the schema, prompt, and model.
  </text>

  <path
    class="feedback"
    d="M310 285 V160"
    marker-end="url(#arrow-accent)"
  />
  <text class="feedback-label accent-fill" x="320" y="261">Feedback</text>
</svg>
