[project]
name = "openui-server"
version = "0.5.3"
description = "Server utilities for OpenUI Cloud: artifacts, conversations, frontend tokens, live dashboards and Autofix"
readme = "README.md"
license = "MIT"
authors = [{ name = "Thesys", email = "engineering@thesys.dev" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

keywords = ["openui", "generative-ui", "server"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.optional-dependencies]
# Dashboards over MCP: `AsyncDashboard.mcp_server()`.
mcp = ["mcp>=2.0"]

[project.urls]
Homepage = "https://openui.com"
Documentation = "https://openui.com/docs/api-reference/server-python"
Repository = "https://github.com/thesysdev/openui"
Issues = "https://github.com/thesysdev/openui/issues"

[dependency-groups]
# Types only: the package never imports these at runtime.
dev = ["mypy>=1.13", "ruff>=0.8", "openai>=1.66", "langchain-core>=0.3", "mcp>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openui_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
