[project]
name = "openui-server"
version = "0.5.3"
description = "Server utilities for OpenUI Cloud: artifacts, conversations, frontend tokens, live dashboards and Autofix"
readme = "README.md"
license = "MIT"
authors = [{ name = "Thesys", email = "engineering@thesys.dev" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

keywords = ["openui", "generative-ui", "server"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.optional-dependencies]
# Dashboards over MCP: `AsyncDashboard.mcp_server()`.
mcp = ["mcp>=2.0"]

[project.urls]
Homepage = "https://openui.com"
Documentation = "https://openui.com/docs/api-reference/server-python"
Repository = "https://github.com/thesysdev/openui"
Issues = "https://github.com/thesysdev/openui/issues"

[dependency-groups]
# Tools and tests. openai, langchain-core and mcp are for types and tests: the package never
# imports them at runtime.
dev = [
  "mypy>=1.13",
  "ruff>=0.8",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "openai>=1.66",
  "langchain-core>=0.3",
  "mcp>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openui_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Expected sentences and payloads read best on one line.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
